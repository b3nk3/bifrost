name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GH_DEPLOYMENTS_BOT_PAT }}
          release_branches: main
          tag_prefix: v
          default_bump: false

      - name: Set up Go
        if: steps.tag.outputs.new_tag
        uses: actions/setup-go@v5.4.0
        with:
          go-version: stable

      - name: Fetch new tag
        if: steps.tag.outputs.new_tag
        run: git fetch --tags

      - name: Run GoReleaser
        if: steps.tag.outputs.new_tag
        uses: goreleaser/goreleaser-action@v6.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DEPLOYMENTS_BOT_PAT: ${{ secrets.GH_DEPLOYMENTS_BOT_PAT }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}

      - name: Publish release
        if: steps.tag.outputs.new_tag
        run: gh release edit ${{ steps.tag.outputs.new_tag }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
